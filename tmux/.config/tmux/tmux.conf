##### Keybindings #####

# Move between panes using Alt + Arrow keys
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# Swap panes directionally and follow the moved pane
bind -n M-S-Left  swap-pane -d -t '{left-of}'
bind -n M-S-Right swap-pane -d -t '{right-of}'
bind -n M-S-Up    swap-pane -d -t '{up-of}'
bind -n M-S-Down  swap-pane -d -t '{down-of}'

# Resize panes using Ctrl + Alt + Arrow keys
bind-key -n C-M-Down resize-pane -D
bind-key -n C-M-Up resize-pane -U
bind-key -n C-M-Left resize-pane -L
bind-key -n C-M-Right resize-pane -R

# Split panes using Alt + | for vertical and Alt + - for horizontal
bind -n M-| split-window -h
bind -n M-- split-window -v

# Detach from the current session using Alt + d
bind -n M-d detach

# Switch windows using Ctrl + Shift + Up/Down
bind -n C-S-Up previous-window
bind -n C-S-Down next-window

# Switch windows using Alt + 1, Alt + 2, etc.
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4


##### General Settings #####

set -g history-limit 5000
set -g mouse on
set -g base-index 1
set -g default-terminal "tmux-256color"

# Use tmux-256color instead of screen-256color
set -g default-terminal "tmux-256color"

# Enable RGB (true color) and Strikethrough/Underline features
# We check for both xterm-256color and the 'alacritty' or 'kitty' types
# depending on what your host terminal identifies as
set -as terminal-features ",xterm-256color:RGB:strikethrough:usstyle"

# If the above doesn't work alone, this older 'overrides' syntax usually does the trick:
#set -as terminal-overrides ',xterm*:smxx=\E[9m'

# Status bar at the top
set -g status-position top

# Add an empty line below the status bar
set -g status 2
set -g status-format[1] " "

# Reduce the escape-time delay to 10ms (ideal for Vim/Neovim users)
set -sg escape-time 10


##### Catppuccin Theme #####

# Theme settings
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

# Remove default background color to allow transparency
set -g @catppuccin_status_background "none"
set -g @catppuccin_window_status_style "custom"

# Custom separators for windows
set -g @catppuccin_window_left_separator "#[bg=default,fg=#{@thm_surface_0}]#[bg=#{@thm_surface_0},fg=#{@thm_fg}]"
set -g @catppuccin_window_right_separator "#[bg=default,fg=#{@thm_surface_0}]"
set -g @catppuccin_window_current_left_separator "#[bg=default,fg=#{@thm_mauve}]#[bg=#{@thm_mauve},fg=#{@thm_bg}]"
set -g @catppuccin_window_current_middle_separator "#[fg=#{@thm_mauve}]█"
set -g @catppuccin_window_current_right_separator "#[bg=default,fg=#{@thm_surface_1}]"

# Plugins
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tpm'


##### Status Line Modules #####

set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""

# Hostname
set -g status-right "#[bg=#{@thm_red},fg=#{@thm_mantle}]#[reverse]#[noreverse] "
set -ag status-right "#[fg=#{@thm_fg},bg=#{@thm_surface_0}] #(whoami)@#(hostname) "

# CPU average utilization
set -ag status-right "#[bg=#{@thm_yellow},fg=#{@thm_surface_0}]#[reverse]#[noreverse] "
set -ag status-right "#[fg=#{@thm_fg},bg=#{@thm_surface_0}] #(~/.config/tmux/cpu_usage.sh) "

# Memory usage
set -ag status-right "#[bg=#{@thm_flamingo},fg=#{@thm_surface_0}]#[reverse]#[noreverse] "
set -ag status-right "#[fg=#{@thm_fg},bg=#{@thm_surface_0}] #(awk '/^MemTotal:/ {t=$2} /^MemAvailable:/ {a=$2; printf \"%.0f%%%%\\n\", 100-(a/t*100)}' /proc/stat /proc/meminfo 2>/dev/null) "

# Session name
set -ag status-right "#{E:@catppuccin_status_session}"

# Session uptime
set -ag status-right "#[bg=#{@thm_sapphire},fg=#{@thm_surface_0}]#[reverse]#[noreverse]󰔟 "
set -ag status-right "#[fg=#{@thm_fg},bg=#{@thm_surface_0}] #(~/.config/tmux/uptime.sh #{session_created}) "

# Battery
set -ag status-right "#(~/.config/tmux/battery.sh '#{@thm_mauve}' '#{@thm_surface_0}' '#{@thm_fg}')"

##### Optional Autostart Import #####

# Hook into session creation to safely run window setup once a target exists
if-shell "[ -f ~/.config/tmux/tmux-autostart.conf ]" {
    set-hook -g after-new-session "source-file ~/.config/tmux/tmux-autostart.conf"
}

##### TPM Initialization (must be last) #####
# If TPM is missing: Clone it, initialize it, install plugins, and source them.
# Otherwise: Just boot TPM normally.
if-shell "test ! -d ~/.config/tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm' \; run '~/.config/tmux/plugins/tpm/tpm' \; run '~/.config/tmux/plugins/tpm/bin/install_plugins' \; run '~/.config/tmux/plugins/tpm/tpm'" \
   "run '~/.config/tmux/plugins/tpm/tpm'"

run '~/.config/tmux/plugins/tpm/tpm'
