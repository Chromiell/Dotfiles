# Ruff configuration (https://docs.astral.sh/ruff/configuration/).
# Kept under .github/linters/ rather than the repository root so tooling config
# does not clutter the top level.
# Run locally with: ruff check --config .github/linters/ruff.toml .
#
# The repository ships a single small utility script, so only Ruff's
# correctness-oriented default rules are enabled. This keeps the check
# meaningful (syntax errors, undefined names, unused imports) without
# reformatting or linting style choices in the script.

[lint]
select = ["E4", "E7", "E9", "F"]
