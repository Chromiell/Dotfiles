name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: "Force the ShellCheck job to fail (tests failure notifications)"
        type: boolean
        default: false

# Cancel superseded runs on the same ref to avoid wasted CI time.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: every job only needs to read the repository.
permissions:
  contents: read

# The linters come from the official marketplace actions below, each pinned to a
# full commit SHA. Dependabot keeps those pins current (see dependabot.yml), so a
# tool is updated by merging a Dependabot PR rather than editing this file.
# ShellCheck is the exception: it ships via apt and tracks the runner image.

jobs:
  shellcheck:
    name: Shell scripts (ShellCheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Simulate failure (manual runs only)
        if: ${{ inputs.simulate_failure }}
        run: |
          echo "::error::Simulated failure requested via workflow_dispatch (simulate_failure=true)"
          exit 1
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint shell scripts
        run: |
          # Lint every tracked file whose shebang is a POSIX shell. This picks up
          # the extensionless scripts under scripts/.local/bin and skips the
          # Expect script that ShellCheck cannot parse.
          mapfile -t files < <(git grep -lI -E '^#!.*(bash|/sh)\b')
          echo "Checking ${#files[@]} script(s)"
          shellcheck --severity=warning --format=gcc "${files[@]}"

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks-action walks the pushed commit range, so it needs full history.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  spelling:
    name: Spelling (typos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: crate-ci/typos@7f9d0819ca1c008ade73f4b41fa9d258d48f605b # v1.51.1
        with:
          config: .github/linters/typos.toml

  links:
    name: Markdown links (lychee)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # --offline validates local (relative) links and anchors only. This keeps
      # the job deterministic and immune to third-party sites being slow or down.
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: --offline --no-progress --include-fragments './**/*.md'
          fail: true

  lua:
    name: Lua formatting (StyLua)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: JohnnyMorganz/stylua-action@76fd70c03e6340ceaf673366712db9b20560b402 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # `latest` follows the current StyLua release; Dependabot tracks the action.
          version: latest
          args: --check neovim/.config/nvim/lua

  python:
    name: Python (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/ruff-action@4919ec5cf1f49eff0871dbcea0da843445b837e6 # v3
        with:
          args: check --config .github/linters/ruff.toml

  stow:
    name: Stow layout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install GNU Stow
        run: sudo apt-get update && sudo apt-get install -y stow
      - name: Stow every package into a clean HOME
        run: |
          fake_home="${RUNNER_TEMP}/fakehome"
          # The shared directories must exist first, otherwise Stow folds them
          # into a single symlink pointing back into the repository.
          mkdir -p "$fake_home/.local/bin" "$fake_home/Documents" "$fake_home/Project"
          # `shopt -u dotglob` keeps dot-directories (such as .github) out of the
          # package list, mirroring the documented `stow */` invocation.
          bash -c "shopt -u dotglob; stow -v -t '$fake_home' */"
      - name: Verify expected paths resolve into the repository
        run: |
          fake_home="${RUNNER_TEMP}/fakehome"
          missing=0
          for entry in .zshrc .config/nvim/init.lua .local/bin/install-adwaita-nerd-font Documents/Scripts Project/PythonScripts/DS1WeaponSwap/swapDS1.py; do
            resolved="$(readlink -f "$fake_home/$entry" 2>/dev/null || true)"
            case "$resolved" in
              "$GITHUB_WORKSPACE"/*) echo "OK   $entry -> $resolved" ;;
              *) echo "::error::$entry does not resolve into the dotfiles checkout"; missing=1 ;;
            esac
          done
          exit "$missing"

  notify:
    name: Notify (run status)
    runs-on: ubuntu-latest
    needs: [shellcheck, secrets, spelling, links, lua, python, stow]
    # Report every completed run (pass or fail). `!cancelled()` keeps the job
    # running even when other jobs fail, but skips runs superseded by a newer push.
    if: ${{ !cancelled() }}
    env:
      # Mapped to an env var because the `secrets` context is not available in
      # step-level `if` expressions.
      WEBHOOK_URL: ${{ secrets.CI_WEBHOOK_URL }}
    steps:
      - name: Send webhook notification
        # Skip when no webhook is configured — e.g. pull requests from forks,
        # which never receive repository secrets.
        if: ${{ env.WEBHOOK_URL != '' }}
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          failures="$(jq -r '[to_entries[] | select(.value.result != "success")] | length' <<< "$NEEDS_JSON")"
          if [[ "$failures" == "0" ]]; then
            mood="✅"; verdict="passed"
          else
            mood="❌"; verdict="failed — ${failures} check(s)"
          fi
          details="$(jq -r '
            def icon:
              if   . == "success"   then "✅"
              elif . == "failure"   then "❌"
              elif . == "cancelled" then "🚫"
              elif . == "skipped"   then "➖"
              else "❔" end;
            to_entries
            | map("\(.value.result | icon) \(.key): \(.value.result)")
            | join("\n")
          ' <<< "$NEEDS_JSON")"
          message="$(printf '%s CI %s on %s (%s) — triggered by %s\n%s\n%s' \
            "$mood" "$verdict" "$REPO" "$REF" "$ACTOR" "$details" "$RUN_URL")"
          # Discord expects {"content": ...}; Slack expects {"text": ...}.
          if [[ "$WEBHOOK_URL" == *"hooks.slack.com"* ]]; then
            body="$(jq -n --arg text "$message" '{text: $text}')"
          else
            body="$(jq -n --arg content "$message" '{content: $content}')"
          fi
          curl -fsS --retry 3 -H 'Content-Type: application/json' -d "$body" "$WEBHOOK_URL"
