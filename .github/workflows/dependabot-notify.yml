name: Dependabot

# Dependabot itself runs on GitHub's schedule and exposes no Actions event, so
# this workflow reacts to the visible result of a run: the CI run on the pull
# request it opened or updated. Runs that find no updates leave no trace and
# therefore cannot be announced.
#
# `workflow_run` is used instead of `pull_request` because Dependabot-triggered
# runs receive no Actions secrets, while `workflow_run` executes in the base
# repository context and can read `CI_WEBHOOK_URL`. See .github/CI.md.
on:
  workflow_run:
    workflows: ["CI"]
    # `in_progress` is the "Dependabot has a pull request and is running CI"
    # notice; `completed` reports the actionable result.
    types: [in_progress, completed]

permissions:
  contents: read

concurrency:
  group: dependabot-notify-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  notify:
    name: Notify (dependency update)
    runs-on: ubuntu-latest
    # Only runs triggered by a Dependabot pull request are relevant. Matching on
    # the actor (rather than the `dependabot/` branch prefix, which any fork can
    # use) keeps a malicious PR from triggering an @here alert.
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]'
    env:
      # Reuses the same webhook as the CI run-status notifications to avoid a
      # second repository secret.
      WEBHOOK_URL: ${{ secrets.CI_WEBHOOK_URL }}
    steps:
      - name: Send webhook notification
        # Skipped when no webhook is configured, like the CI notify job.
        if: ${{ env.WEBHOOK_URL != '' }}
        env:
          ACTION: ${{ github.event.action }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          TITLE: ${{ github.event.workflow_run.display_title }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          # Starting CI is routine. A successful update is ready for review and
          # a failed one needs a fix; both are actionable, so they are flagged
          # as important and may ping the channel.
          ping=""
          if [[ "$ACTION" == "in_progress" ]]; then
            mood="🤖"
            heading="Dependabot opened or updated a pull request — CI is running"
          else
            case "$CONCLUSION" in
              success)
                mood="🚨"
                heading="IMPORTANT — Dependabot update passed CI and is ready to merge"
                ping="@here"
                ;;
              failure)
                mood="🚨"
                heading="IMPORTANT — Dependabot update failed CI and needs attention"
                ping="@here"
                ;;
              *)
                mood="🤖"
                heading="Dependabot CI run finished: ${CONCLUSION:-unknown}"
                ;;
            esac
          fi

          # `display_title` is the PR title for pull-request runs, but fall back
          # to the branch name if it is empty.
          TITLE="$(printf '%s' "${TITLE:-$HEAD_BRANCH}" | tr '\n' ' ')"
          if [[ -n "$PR_NUMBER" ]]; then
            TARGET="$SERVER_URL/$REPO/pull/$PR_NUMBER"
            reference="#$PR_NUMBER — $TITLE"
          else
            TARGET="$RUN_URL"
            reference="$HEAD_BRANCH"
          fi

          # Discord expects {"content": ...}; Slack expects {"text": ...} and
          # uses a different mention syntax.
          if [[ "$WEBHOOK_URL" == *"hooks.slack.com"* ]]; then
            ping="${ping:+<!here>}"
            body="$(jq -n --arg text "$(printf '%s %s%s\n%s\n%s\n%s' \
              "$mood" "$heading" "${ping:+ $ping}" "$REPO" "$reference" "$TARGET")" '{text: $text}')"
          else
            body="$(jq -n --arg content "$(printf '%s %s%s\n%s\n%s\n%s' \
              "$mood" "$heading" "${ping:+ $ping}" "$REPO" "$reference" "$TARGET")" '{content: $content}')"
          fi
          curl -fsS --retry 3 -H 'Content-Type: application/json' -d "$body" "$WEBHOOK_URL"
