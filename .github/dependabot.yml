version: 2

updates:
  # Keep the GitHub Actions used by the workflows up to date.
  #
  # Every linter in .github/workflows/ci.yml is a marketplace action pinned to a
  # commit SHA, so Dependabot bumps the tools by opening PRs here; see .github/CI.md.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
